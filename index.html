    <script>
        // ═══════════════════════════════════════════════════════════════
        //  HOW TO ADD NEW DIARY CONTENT
        //  ─────────────────────────────
        //  Every entry in the DIARY_ENTRIES array below automatically
        //  starts on a brand-new page — no more typing [NEWPAGE] by hand.
        //
        //  To add a new entry, just add a new string to the array:
        //
        //      `Entry 1 text...`,
        //      `Entry 2 text...`,
        //      `Your new entry text...`,   <-- just add this
        //
        //  If you ever want a forced blank page in between two entries,
        //  just add an empty string "" as its own array item.
        // ═══════════════════════════════════════════════════════════════
        const DIARY_ENTRIES = [
            "Hey!! I'm Rachittt... Never mind, it doesn't really matter what my name is. I don't think anyone is ever going to find this weird little virtual diary anyway. After all, I'm the only one who has the link to it, so that makes sense, doesn't it? Honestly, I have no idea what I'm going to write here. Sometimes my thoughts become too loud to keep inside my head, and I feel like I should leave them somewhere—some place where they can exist without being judged. So... here I am. Do I need to introduce myself? I don't think so. Apparently, I'm at what some philosophers love to call \"the best years of a person's life.\" What a ridiculous idea. I don't even believe the word <strong>best</strong> deserves ten percent of the importance people give it. If this is what <strong>best</strong> feels like, then maybe the definition itself is broken. Everything feels exhausting, irritating, and strangely empty because I can't seem to connect with the people around me, no matter how hard I try. Living away from my family—the <strong>REAL LOVED ONEs</strong>—hurts in ways that only reveal themselves during those random moments after midnight, when the world falls silent and your thoughts become louder than ever. If I had to describe my life right now, I'd say it feels like living inside a prison whose walls no one else can see. I don't feel the warmth I expected from friendships. No matter how many people surround me, there's always a strange distance that never disappears, as if everyone is simply passing through my life rather than walking beside me. And maybe that's just how life has always been. As time passes, you slowly realize that many of the things you once believed were nothing more than beautiful myths. This life is yours. This journey is yours. Every emotional attachment, every burden, every sleepless night filled with overthinking—they all belong to you. No one else can carry them for you, and no one else can truly understand the weight you feel inside your own mind. We grow up watching movies and web series that quietly plant impossible expectations within us. They tell us that one day someone will enter our lives and magically make everything easier, someone who will understand every unsaid word, stay through every storm, celebrate every victory, and never let us feel alone. We begin to believe in soulmates, in perfect timing, and in people who somehow complete us. But reality doesn't follow scripts. The truth is far less comforting. Every expectation we build upon someone else becomes another handful of earth thrown onto the graveyard of our own emotions. The more we expect, the deeper we bury ourselves. The internet, stories, and fictional romances convince us that somewhere there's a person destined to rescue us from loneliness. By the time we realize that no one is coming to save us, it's often too late. By then, we've already built a prison out of our own expectations, and loneliness has quietly become its only permanent resident.",


            "Okay, enough of this English... FvCK this sh*t. If I were to talk about myself, I'm not the kind of guy who walks into college with a huge friend circle, acting cool or trying to be some thug. Nah... I'm nothing like that. Sometimes I genuinely feel like I'm different from everyone else, maybe even a little weird. I don't know why, but over time that's just who I've become. I don't like crowds. I don't like having too many people in my life or trying to connect with everyone I meet. I know it sounds stupid, but that's just how I am. I can't find happiness in everything the way most people seem to. My world has always been small. It's mostly my family and one or two friends. And now, even those friends sometimes feel fake. As time passed, I started believing that maybe I had already found my soulmate back in high school. I met a girl. She was... different. The feeling I had the first time I saw her was something I'd never experienced before with anyone else. She was wearing a mask, cute pink glasses, had long silky hair, and the prettiest eyes I'd ever seen. For a moment, all I could think was, <strong>OMG, Rachit... are you in love?</strong> But reality hit almost immediately. I looked at myself and thought, <strong>You literally look like wet concrete.</strong> It was only natural to think that if I found her this beautiful, every other guy probably did too. Yet somehow... I got her. But the journey between first seeing her and finally calling her mine was anything but easy. I can't even describe how much I broke myself along the way. Somewhere in that journey, I lost who I was. I collected insecurities one after another, and now they've grown into a constant fear—a fear that one day I'll lose her too. <strong>My heart has been broken before... not once, but over and over again.</strong> Even then, I kept admiring her, loving her, believing that she completed the parts of me that felt empty. But when I look at myself today, I see nothing but a blank canvas. I have no idea what I'm going to do with my life. Will I ever become the person she deserves? Will I ever become her life partner? Will she stay with me forever, or will history repeat itself and leave me cheated once again? Will this relationship survive everything life throws at us? Can I become a better person? Should I become more selfish? Will I ever make my family truly happy and make them proud? There are countless questions living inside my head, and the worst part is that none of them ever seem to leave. Maybe that's because I'm an <strong>overthinker</strong>, and my mind has never learned how to stay quiet.",


            "I'm sure everyone goes through a phase like this at some point in their lives. But just as the fading sun marks the end of one day only to make way for another, this phase of struggle eventually comes to an end too. I guess the only way to escape these emotions, even if it's just for a while, is to distract ourselves with random things—watching movies, coding, learning new skills, or simply keeping our minds occupied with something meaningful. That's exactly how I try to keep myself stable, even though I know it's far from easy. Sometimes, there isn't any option other than enduring everything life throws at you, and maybe that's why we slowly begin isolating ourselves without even realizing it. Anyway, this is supposed to be <strong>my personal diary</strong>, so I should probably write more about myself instead of sounding like some philosopher every other sentence. <strong>LOL.</strong> I have a habit of drifting into philosophical thoughts for no reason. <strong>XD.</strong> As for my life, I don't really have some extraordinary dream. My biggest goal—my only motto, if you can call it that—is to have a good job. And by <strong>good</strong>, I don't just mean a high-paying one. I mean a job that lets me buy the things I want without having to think about the price ten times before making a decision. If I'm genuinely happy and financially stable, my parents will automatically be happy too. After all, what more could a mother and father possibly want than to see their child smiling? I know some people believe that their parents are the strictest in the world and that no one understands them. Honestly, I used to think along those lines too. It's not like my parents were never strict—they were. But life has a strange way of changing people. Certain experiences changed their perspective so deeply that they eventually realized something much more important than society, expectations, or comparisons. They realized that, above everything else in this world, <strong>their son or daughter matters the most.</strong>",


            "I still remember my <strong>10th board exams</strong>. That was probably the first time I truly experienced something close to anxiety. I was panicking because it was my first time appearing for a proper board examination at an external center, and the pressure felt overwhelming. But compared to what came later, that was nothing. The real storm arrived during <strong>11th and 12th grade</strong>. It felt like every important exam in my life had decided to happen at the exact same time—practical exams, prelims, board exams, <strong>JEE Session 1</strong>, <strong>JEE Session 2</strong>, and <strong>MHT-CET</strong>. Everything crashed into my life all at once, and honestly... I couldn't handle it. Every time I tried to focus on one thing, something else slipped through my hands. It felt impossible to give my best anywhere because I was constantly running from one responsibility to another. Somehow, I kept pushing myself because there wasn't really another choice. I barely survived my board exams, both attempts of JEE left me mentally exhausted, and on top of all that, practical submissions had completely destroyed my sleep schedule. There were nights when I stayed awake until <strong>2 A.M.</strong>, trying to finish journals, assignments, and practical files before deadlines swallowed me whole. And then, as if life wasn't already testing me enough, something happened that completely shattered whatever strength I had left. As I mentioned earlier, I was in a situationship with her. One night, I found out that <strong>her ex had come back into her life.</strong> That single piece of information broke something inside me. I couldn't think straight anymore. I remember staring at my unfinished practical work and saying to myself, <strong>FvCK these practicals... I'm not doing this.</strong> My mind stopped caring about deadlines, exams, or anything else. All I could think was, <strong>What the hell just happened?</strong> I kept replaying everything in my head, trying to understand it, trying to find a reason, trying to convince myself that maybe I had misunderstood something. I stayed awake until almost <strong>3 A.M.</strong>, completely lost inside my own thoughts. Eventually, I couldn't take it anymore. I quietly walked into my parents' room, gently moved my little sister to the other side of the bed, and lay down beside my mom. I was shivering so badly that she suddenly woke up. She looked at me with worry in her eyes, touched my forehead, and thought I had a fever. But the truth was... my body wasn't burning because of illness. It was breaking under the weight of emotions I didn't know how to carry.",


            "When my <strong>MHT-CET</strong> result came out, I realized it was just... average. It wasn't bad enough to call it a failure, but it wasn't good enough to feel proud of either. I had hoped to get into <strong>VIT</strong>, but because of some documentation issues, that opportunity slipped away from me. It was frustrating because it wasn't even about my score anymore—it was something completely out of my control. With no other option left, I decided to take a drop year. It wasn't an easy decision, but sometimes life leaves you with only one path, no matter how much you wish there were others. I worked hard, appeared for the exam again, scored <strong>96 percentile</strong>, and this time, I finally made it into <strong>VIT</strong>. Looking back, I think experiences like these changed not only me but my parents as well. They've seen me struggle, fail, overthink, and silently carry burdens that I rarely talk about. Maybe that's why they've become so protective of me. I'm the kind of person who naturally looks sad most of the time. It's not that I'm always unhappy, but my face somehow tells a different story. Anyone who looks at me for a few seconds would probably assume that I'm carrying the weight of the world on my shoulders. My parents noticed that too. They started taking extra care of me, constantly making sure I wasn't stressing too much or worrying about things that were beyond my control. They never wanted me to carry everything alone. And somewhere along the way, I realized something that became my biggest motivation. More than success, money, or achievements, all I really want is to see my parents smile. Because it's simple—<strong>if I'm genuinely happy, my parents are happy too.</strong> That's all they've ever wanted for me, and maybe that's all I've ever wanted for them.",


            "Secondly, there's someone who is family to me even though we aren't related by blood. Yessss... you're right. I'm talking about <strong>my soulmate.</strong> Even I don't know how I ended up loving my girlfriend this deeply. Maybe love doesn't really ask for permission before making itself at home inside you. It's like standing in front of the most beautiful flower in an entire garden—once your eyes are fixed on it, every other flower simply fades into the background. That's exactly how it has been for me. Ever since she came into my life, I've never felt the desire to look at anyone else. Her presence, or even the thought of her absence, matters to me more than I can put into words. Sometimes it honestly feels like the majority of my life depends on her existence. She's not just my girlfriend; she's my <strong>besttestttt friend</strong>, and I genuinely mean that. I even introduced her to my mom because I hate hiding important things from her. Somewhere deep down, Mom already knows how much I love this girl. I tell her almost everything that's happening in my life—well, not literally everything—but all the moments that truly matter. That's just the kind of bond we share. And yes... I want to spend the rest of my life with her. I want my future to have her in it. But with that dream comes countless fears that never seem to leave my mind. Will we ever get married? Will her family accept me? Mine probably will... at least I hope they will. Still, the fear never disappears. Sometimes I lie awake wondering what if one day she decides to leave me. What if she walks away? I know myself well enough to admit that I wouldn't know how to recover from something like that. I'd probably find myself trapped in a place so dark that I wouldn't know how to escape it. And then there are the insecurities. Let's be honest—girls usually have far more options than guys ever do. Sometimes that thought alone is enough to fill my mind with doubt. I catch myself wondering, <strong>Why does everyone seem to like the person I love?</strong> But the truth is, those thoughts are born from insecurity, and if you're insecure, you eventually have to learn how to live with it instead of letting it consume you. Out of all the choices she could have made, she chose me. Maybe that's something I should trust more instead of questioning every single day.",


            "Someone might look at all this and think, <strong>What if she eventually replaces me?</strong> That thought crosses my mind too, more often than I'd like to admit. But that's where another side of me takes over—the side that's driven more by fear than by hope. Sometimes I find myself wondering if love was ever meant for someone like me in the first place. <strong>Maybe love was never written into my story.</strong> I won't lie... there are moments when I question why I ever learned how to love so deeply. Loving someone this much also means giving them the power to break parts of you that you never knew existed. There are days when everything feels unbearably heavy, when my mind grows tired of carrying all these thoughts, and all I want is to leave everything behind for a while and simply disappear from the noise, the expectations, and the constant overthinking. Maybe not because I want to run away from life, but because I desperately want a place where my mind can finally be quiet.",


            "Sometimes it feels like this <strong>long-distance relationship</strong> isn't going to work. Recently, she told me that she wanted some space so she could focus on herself. Honestly, I respect that decision. A relationship should never feel like a burden, so we decided to become <strong>best friends</strong> again instead. But deep down, I can't ignore the feeling that this decision might slowly push us farther and farther away from each other. She assured me that she'd always stay loyal to me, and I truly wanted to believe every word she said. But if I think about it logically, once your trust has been shaken, you can never go back to being the same person you were before, can you? That incident changed something inside me. It left me carrying insecurities that weren't there before, and no matter how hard I try, I can't pretend they don't exist. Sometimes I feel like things will never be the same again. Day by day, it feels as if we're quietly turning into strangers who still remember each other's names. I know she's someone who's easily influenced by the people around her, and maybe that's another reason why my mind refuses to stay calm. I don't know if it's just my overthinking or if there's actually some truth to it, but sometimes I feel like she doesn't love me with the same intensity that I love her. Maybe I'm wrong. Maybe I'm not. I honestly don't know anymore. But anyway... enough of this depressing chapter. This kind of thing somehow always finds its way into my life. Let's leave it here and talk about something a little different instead.",


            "Yep... sometimes I randomly start thinking about the purpose of <strong>life</strong>. Like... why does this world even exist? Out of nowhere, there's a planet called Earth, and somehow humans ended up living on it. The more I think about it, the more fascinating it becomes. Then I start wondering what humanity has actually accomplished over thousands of years. It's honestly unbelievable. We've built entire civilizations from nothing. We've figured out how to send data wirelessly across the world, fit billions of tiny transistors onto a single processor, leave the Earth, land on the Moon, send missions to Mars, and create technologies that would have sounded like pure fantasy a few centuries ago. When you stop and think about it, it's actually crazy. At the same time, I realize how incredibly vast this world is. There are endless things left to learn and explore—nature, mythology, technology, different cultures, people, countries, fashion, science, history, and so much more. Every time I discover something new, it feels like I've only taken the first step on an endless staircase. Of course, none of these things are easy to achieve, but then I remind myself that every person who changed the world wasn't born with extraordinary knowledge. They were just ordinary people who kept learning, experimenting, failing, and moving forward until they became extraordinary. That's the part that inspires me the most. Sometimes when I look around at my classmates in school, coaching classes, or college, I don't see the same curiosity or excitement that I feel inside. Maybe they're simply enjoying the present phase of their lives, and there's absolutely nothing wrong with that. I'm not judging them. I just find myself wondering what their dreams are, what kind of future they're imagining for themselves, and what keeps them awake at night. As for me, I want to explore every possible thing that sparks my curiosity. I want to learn without limits, experience the world, build things that make me proud, own a crazy-ass sports car someday, and most importantly, live a peaceful life with a small, loving family. I know none of that will come easily. Dreams don't become reality on their own. If I truly want that life, then I also know one thing for sure—<strong>I'll have to grind harder than I ever have before.</strong>",


           "Today is <strong>3rd June</strong>, and it's been two weeks since we last had a proper conversation. I still remember the day she told me she needed some space to focus on herself, and I remember writing, <strong>\"I'm afraid that I'll end up losing her.\"</strong> Turns out... I was right. The part that disappoints me the most isn't that she's gone distant; it's the fact that I had to beg someone to prioritize me the same way I prioritized them. Slowly, I'm beginning to accept a truth that hurts more than I expected—you can't force someone to love you the way you love them. Maybe she never loved me the way I believed she did, because if she had, things probably wouldn't have turned out like this. I genuinely don't understand how someone who says they're in love can go days without even wanting a ten-minute conversation with the person they love. Maybe people are different, or maybe I was simply loving alone. I don't know anymore. I feel like I've been played, yet I'm too exhausted to even search for answers. My mind is completely blank. I had never imagined a version of my life where she wasn't a part of it, and watching her slowly disappear without a word has turned me into a shadow of the person I used to be. She's fading away as if everything we shared meant nothing, and somewhere along the way she made me question my worth, my heart, and even myself. All I ever wanted was a little love, a little care. Was that really too much to ask for? I always wished for a partner who could quiet my overthinking, not someone who would simply say, <strong>\"Jo samajhna hai samjho.\"</strong> I've decided I'm done forcing conversations. If someone can go an entire day without feeling the need to talk to me, then no matter how much it hurts, maybe I shouldn't be the one texting first anymore. Maybe the last thing I can do for someone I truly loved is accept becoming just a friend to the person I once imagined spending my entire life with. I've realized that loving someone with all your heart doesn't guarantee they'll stay. I kept hoping we wouldn't become strangers, but maybe that's simply how my story was written. Looking back now, the signs were always there. The delayed replies even when she was online, asking for space, wanting our relationship to become a friendship again... maybe I should've understood what those things really meant. But what hurts the most isn't losing the relationship—it's carrying so much love for someone while being left alone with all the memories. The movies we watched together, the meals we shared, our rides together, that kiss... every memory feels beautiful and painful at the same time. Sometimes I just want to cry somewhere so far away that no one can hear me. Right now, I feel completely lost. Part of me wonders if I should still try to fix everything, but another part already knows that love can't survive if only one person is trying. If we were never meant to be together, I almost wish I could erase every memory we created, because remembering them hurts more than forgetting ever could. I've been broken so deeply that I honestly don't know how to heal anymore. It feels like I've become a <strong>jaded cynic</strong>, someone who no longer knows what believing in love feels like. I don't even have a friend I can truly talk to about everything that's happening inside me. I thought she was that person. Now it feels like there's no one. I don't think I can afford to love someone again anytime soon. Maybe the only thing left for me is to endure this pain until it becomes familiar enough that it no longer controls me. I won't chase her anymore. I've given enough chances, and if she truly wanted me in her life, I don't think I'd have to keep proving my place in it. If she ever wants to reach out, she knows where to find me, but I'm no longer going to build my life around that possibility. I know it's easy for my insecurities to whisper that she'll find someone else much faster than I ever could, that she always had more choices while I spent too much time hating the person I saw in the mirror. Maybe those thoughts are true, maybe they're not—but I don't want them to define who I become. Right now, it just feels like I've lost the ability to love someone the way I once did. Maybe time will prove me wrong. Until then... I'll leave this page here. See you, future me. <strong>Hey Rachit, I know you're hurting more than you've ever hurt before, but don't let this become your weakness. This too shall pass. You'll grind harder, achieve your goals with your own hands, and rebuild yourself piece by piece. Whether you fall in love again or not, promise yourself one thing—you'll never stop becoming the person you wanted to be. GGs.</strong>",


            "Today is <strong>June 4</strong>. Deep down, a part of my heart is still waiting for things to get better between us. I keep thinking about texting her and asking, once and for all, what she really thinks about whatever is happening between us right now. I just want clarity. I want to know whether she still wants me in her life or if it's only me holding onto expectations that no longer exist. But every time I think about sending that message, something inside me stops me. I still can't get over her or the memories we've made together. I keep telling myself, <strong>Just send one last message. Ask her what she actually wants. Whatever the answer is, at least it'll be clear.</strong> Because living like this, trapped between hope and uncertainty, is exhausting. Sometimes it feels like this constant confusion hurts more than anything else. Then another thought crosses my mind—if she really wanted to talk to me, she could text me too. But she doesn't. So I keep waiting, wondering when she'll finally reach out, while another part of me quietly whispers that maybe her message will never come. I've always been the one to text first, the one trying to hold everything together, but somewhere along the way I think I've sacrificed enough of my self-respect. For now, I'll just wait and watch where all of this leads, even though I have no idea how it's going to end. The hardest part is that I don't even understand my own feelings anymore. Do I still love her? Or am I just terrified of losing her? Maybe I've simply grown so used to having her in my life that I don't know how to exist without her. Or maybe I've forgotten what love is supposed to feel like in the first place. The truth is, I don't think I've ever been very good at protecting my own self-respect. Maybe some things are meant to be left in the hands of time. Maybe not every answer has to be chased, and maybe the only thing I can do right now is hope that whatever is meant to happen will eventually happen. That's all for today. <strong>GGs.</strong>",


            "Today's <strong>June 6</strong>. I'm still wondering why she hasn't texted me. No matter how much I try, I just can't fckin move on. Every few hours, I get this overwhelming urge to message her and ask if she's really okay with ghosting me like this. I actually did type out a message today... but I unsent it. I don't even know why. Maybe I was scared of the answer, or maybe I was hoping she'd reach out first. At this point, I honestly don't know anymore. I feel trapped inside my own thoughts, and all I seem to crave is the smallest sign that I still matter to her—a little love, a little care, anything. I don't think I can keep carrying this uncertainty anymore. I just want to ask her directly. Whatever answer she gives me, I'll accept it. At least then I'll finally know where I stand. If I don't ask now, I don't think I'll ever find peace. My insecurities will keep creating stories inside my head, and I'll never know which ones were true. Maybe her answer won't be the one I'm hoping for, but at least it'll tell me whether she still wants me in her life or not. I've done everything I could to remind her how deeply I love her, but maybe the elders are right—sometimes people only realize the value of something after they've lost it. Whatever happens, I genuinely hope both of us find happiness in our own lives instead of spending our time begging for someone's attention or love. Now all that's left is to see what decision she makes. If her answer is <strong>no</strong>, then I'll stop chasing what's already slipping away. I'll focus on myself, build a clear direction for my life, and become the kind of person I can be proud of. One thing echoes loudly in my mind, though—I don't think trusting people will ever come easily again. Whether it's friends, best friends, or anyone else, no matter how comfortable they make me feel, I'll always remind myself to stay emotionally independent. Not because I want to stop caring about people, but because I never want my entire world to depend on someone else's presence again. Maybe for now, I just want to explore life, learn new things, and build myself into someone stronger. I can't afford to let my heart break the same way twice. I never imagined that the person I loved the most could one day make me feel this distant. If that can happen, how can I expect anyone to stay forever? The part that hurts the most isn't just losing her—it's losing the future I had imagined with her. The little dreams, the plans, the promises... they all feel like memories from a life that never really happened. But maybe that's the thing about promises—they aren't always broken out of malice. Sometimes people change, sometimes circumstances change, and sometimes two people simply grow in different directions. It still hurts, but I don't want that pain to define the rest of my life. Whatever happens next, I'll face it. <strong>GGs.</strong>",


            "It's <strong>June 8</strong> today. I finally gathered the courage to text her and ask the one question that had been haunting me for days—whether she still wanted me in her life or not. And well... destiny didn't choose my side this time. She said <strong>no</strong>. She told me that she's focused on one thing right now and that she'll stay committed to it until the very end. I didn't argue. I didn't try to convince her to change her mind. I spoke to her as calmly and politely as I could because, at that point, there was nothing left to fight for. I only asked one more thing—whether she'd continue ghosting me the way things had been lately. She said things would stay exactly as they are now. When I finally said goodbye, she suddenly asked if I was going to block her. I simply replied, <strong>no</strong>. Maybe she was just asking out of curiosity, or maybe there was a little fear of losing me too. I don't know. But for a brief moment, that thought brought me a strange sense of comfort. And yes... it's official now. Our paths have separated. Maybe they'll cross again someday, and maybe they won't. Only time knows the answer. Surprisingly, though, I'm not feeling as broken as I thought I would. Maybe clarity hurts less than uncertainty. At least now I know that she doesn't need my presence the way I needed hers, and I've finally accepted something I had been resisting for so long—you can't force someone to love you. I respect her decision, no matter how painful it is. She has dreams of her own, just like I do. She deserves the chance to become the best version of herself, to chase everything she's working so hard for. <strong>Her success is also a part of my dream.</strong> No matter what happens between us, I'll always wish the very best for her. A part of me still hopes that one day our paths will meet again, and maybe, just maybe, she'll become mine forever. If that day ever comes, I'll love her with everything I have because her happiness has always felt like a part of my own. But until then, I have my own journey to continue. I'll become a better version of myself—not for anyone else, but because I owe that to the person I'll become in the future. And if life ever gives me another chance, I'll ask her one more time whether she'd like to be my forever. Until then, I'll keep moving forward. Maybe God hasn't finished writing my story yet. Maybe there are still countless pages left waiting for me to fill them with things that are actually under my control. Life has always been unpredictable, and I'm sure there are many more chapters waiting ahead of me. Whatever they bring, I'll be ready to face them. <strong>GGs.</strong>",


            "Today's <strong>June 25</strong>, and things are going pretty well. Life feels calmer now. Of course, I still miss her sometimes, but I guess that's obvious. I loved her, and feelings like that don't disappear overnight. But never mind... I'm doing alright. One thing I've noticed, though, is that the part of me that used to love so deeply is slowly fading away. I don't know if that's healing or if I'm simply becoming numb, but I don't seem to care about things the way I used to. Maybe I'll just leave everything to destiny and see where life decides to take me. There are moments when I feel like texting her, just to ask how she's doing, but then I remember the conversation we had. She clearly told me that she didn't want to be with me anymore, so why should I keep trying to change a decision she has already made? Love shouldn't be something that has to be forced. Ironically, today I was actually thinking about sending her a message, asking how life had been treating her, but before I could do that, I received a text from her asking what I was doing. For a second, I won't lie... it made me happy. It felt nice knowing that she still thought about reaching out. But I also know myself. If I let myself get emotionally attached again, I'll probably end up hurting in exactly the same way as before. Maybe I'm wrong, but right now it feels like love simply isn't meant for me. My insecurities still whisper the same old things—that I look like a piece of sh*t, like wet concrete—but I'm trying not to let those thoughts decide who I am anymore. Instead, I'm slowly learning to focus on the future I want to build. I'm a complete <strong>gadget lover</strong>, and sometimes I imagine the day I'll finally have a good job, earn enough to buy whatever I genuinely want without overthinking every purchase, maybe get myself a <strong>MacBook</strong>, switch completely to the <strong>Apple ecosystem</strong>, and enjoy the little rewards of all the hard work I'll put in. It sounds like a small dream compared to everything else, but somehow it makes me smile. One day, I'll make it happen. Until then, I'll keep moving forward, one step at a time. <strong>GGs for today.</strong>",


            "4th July. Early Morning. I woke up today with my heart pounding so violently that, for a few moments, I couldn't tell whether I had escaped a nightmare or was still trapped inside it. The dream left me shattered. Maybe writing it down will make the weight on my chest a little lighter. Of course... it was about her. In the dream, all of my friends had gathered together, and somehow she was there too. Dreams never bother explaining how impossible things happen—they simply do. The moment my eyes met her, every wall I had spent months building to protect myself came crashing down. Every sleepless night, every attempt to move on, every promise I had made to myself... it all disappeared in a single heartbeat. But that wasn't the part that hurt the most. The real pain was that she never looked at me. Not even once. It was as if I didn't exist. As if I were nothing more than empty space she walked past without noticing. Everyone laughed, talked, and eventually decided it was time to leave. One by one, they walked away. So did she. Without a glance. Without a goodbye. Without acknowledging that I had been standing there the entire time. I stayed where I was, watching her silhouette grow smaller with every step she took. Then the sky broke open. Rain poured down, soaking everything around me, and slowly... her figure dissolved into the rain until she was gone. I was still standing there. Frozen. My two closest friends eventually found me. They called my name once... twice... maybe more. I couldn't hear them. Their voices felt distant, swallowed by the storm inside my head. Then something in me broke. I burst into tears. Do I really look that bad? I cried. Am I so easy to forget? Am I such a terrible person that my existence doesn't even deserve a single glance from her? The questions poured out with the tears. I cried harder than I ever have, unable to stop, unable to breathe properly. Then, without warning, the dream changed. I was standing alone at a bus stop. Across the road, I saw her again. She walked past me as though fate was giving me one last chance. I called her name. Once. Twice. Again and again. I followed her, hoping that maybe this time she'd turn around. She never did. Not even once. Somewhere beside me was a girl I didn't recognize. I can't remember her face, her voice, or even her name. She was simply another stranger my dream had created. She looked at me with quiet sadness and said, Let her go. She doesn't care anymore. Stop chasing someone who's already gone. You don't have to keep running after her. Those words hurt more than silence ever could. I stood there crying until everything around me faded into darkness. Then I woke up. My breathing was rapid, my chest felt tight, and my heart raced as though I had actually been running for miles. For a few terrifying seconds, I couldn't separate the dream from reality. I know it was only a dream. But sometimes dreams know exactly where our deepest wounds are. I've tried so hard to move on. I've fought with my own memories every single day. I've convinced myself that I'm getting better, that time is doing its job. Yet one dream was enough to make all of that feel meaningless. Maybe I really can't move on. Or maybe I'm just tired of fighting something my heart still refuses to let go. At this point... I don't even know what I'm supposed to do anymore. Maybe it's easier to leave everything exactly where it is and let time decide what becomes of me. I'll write again soon. There's still so much left inside me that words haven't managed to carry. GG's",

            
            "It was the 6th of August, and the clock was slowly inching toward midnight. It was almost 11:50 p.m. In just ten minutes, the date would change to the 7th, and a day after that, it would be her birthday. Somehow, the approaching days carried a weight I couldn't ignore. I still couldn't understand what was wrong with me. Why was I so deeply connected to someone who was no longer a part of my life? Had I been foolish enough to let myself become completely dependent on another person? My mind knew the truth—that she was gone—but my heart refused to accept it. Or perhaps it wasn't just her absence that terrified me. Maybe my heart feared the possibility that no one would ever truly choose me, or want me the way I had wanted someone else. I wished I could be like everyone else, the people who brushed these things aside as nothing more than an unfortunate chapter of life. They stumbled, they healed, and they moved on. But I couldn't. I felt stranded in a place I couldn't name, unable to take even a single step forward. I was trapped in a silence filled with questions that never seemed to find answers. More than anything, I kept asking myself one question: Why? What had I done to myself? How had the desperate pursuit of someone else's presence led me to lose my own? Somewhere along the way, while trying so hard to hold on to someone, I had let go of the person I used to be. And now, all that remained was the hope that one day I would finally understand how I had become a stranger to myself."

        // Internally we still stitch everything together with [NEWPAGE]
        // markers because that's what the pagination engine understands.
        const textData = DIARY_ENTRIES.join(" [NEWPAGE] ");

        const book = document.getElementById('book');
        const bookWrapper = document.querySelector('.book-wrapper');
        let leaves = [];
        let currentLeaf = 0;

        function getPageWidth() {
            // The book is 90vw capped at 800px, and each leaf takes up
            // half of that. Measuring the real element (instead of a
            // hard-coded 400px) is what keeps text from getting clipped
            // on phones/tablets where the book is narrower.
            const bookWidth = book.getBoundingClientRect().width || bookWrapper.getBoundingClientRect().width;
            return Math.max(bookWidth / 2, 200);
        }

        function paginate() {
            book.innerHTML = '<div class="spine"></div>';
            leaves = [];
            currentLeaf = 0;

            const pageWidth = getPageWidth();

            let tempDiv = document.createElement('div');
            tempDiv.style.cssText = `width:${pageWidth}px; padding:35px; line-height:1.6; font-size:15px; font-family:'Poppins', sans-serif; visibility:hidden; position:absolute; box-sizing:border-box; text-align:justify; hyphens:none; word-break:keep-all;`;
            document.body.appendChild(tempDiv);

            const segments = textData.split(/\[NEWPAGE\]/);

            let pagesText = [];

            for (let seg of segments) {
                seg = seg.trim();
                if (!seg) {
                    pagesText.push("");
                    continue;
                }

                let words = seg.split(' ');
                let currentText = "";

                for (let word of words) {
                    let testText = currentText + word + " ";
                    tempDiv.innerHTML = testText;
                    if (tempDiv.scrollHeight > 490) {
                        pagesText.push(currentText);
                        currentText = word + " ";
                    } else {
                        currentText = testText;
                    }
                }
                pagesText.push(currentText);
            }

            document.body.removeChild(tempDiv);

            for (let i = 0; i < pagesText.length; i += 2) {
                const leaf = document.createElement('div');
                leaf.className = 'leaf';
                leaf.style.zIndex = Math.floor(pagesText.length / 2) - Math.floor(i / 2);
                leaf.innerHTML = `
                    <div class="page front">${pagesText[i] || ""}</div>
                    <div class="page back">${pagesText[i + 1] || ""}</div>
                `;
                book.appendChild(leaf);
                leaves.push(leaf);
            }

            updatePageJumpTotal();
        }

        function updatePageJumpTotal() {
            const totalEl = document.getElementById('pageJumpTotal');
            const inputEl = document.getElementById('pageJumpInput');
            if (totalEl) totalEl.textContent = `/ ${leaves.length}`;
            if (inputEl) inputEl.max = leaves.length;
        }

        const FLIP_MS = 1100;

        // Each leaf animates completely independently, so clicking Next
        // rapidly starts a new flip immediately instead of waiting for
        // the previous flip to finish — you get several pages turning
        // over each other at once, like riffling through a real book.
        function nextPage() {
            if (currentLeaf >= leaves.length) return;
            const leaf = leaves[currentLeaf];
            currentLeaf++;
            flipLeaf(leaf, 'forward', currentLeaf + 100);
        }

        function prevPage() {
            if (currentLeaf <= 0) return;
            currentLeaf--;
            const leaf = leaves[currentLeaf];
            flipLeaf(leaf, 'backward', leaves.length - currentLeaf);
        }

        function flipLeaf(leaf, direction, finalZIndex) {
            clearTimeout(leaf._flipTimer);
            document.body.classList.add('flipping');
            leaf.style.zIndex = 999;
            leaf.classList.remove('flipping-forward', 'flipping-backward');
            void leaf.offsetWidth; // restart animation cleanly
            leaf.classList.add(direction === 'forward' ? 'flipping-forward' : 'flipping-backward');

            leaf._flipTimer = setTimeout(() => {
                leaf.classList.remove('flipping-forward', 'flipping-backward');
                if (direction === 'forward') {
                    leaf.classList.add('flipped');
                } else {
                    leaf.classList.remove('flipped');
                }
                leaf.style.zIndex = finalZIndex;
                leaf._flipTimer = null;
                maybeClearFlippingState();
            }, FLIP_MS);
        }

        function maybeClearFlippingState() {
            const stillAnimating = leaves.some(l => l._flipTimer);
            if (!stillAnimating) {
                document.body.classList.remove('flipping');
            }
        }

        // ── instant jump: used by First / Last / "go to page" so you don't
        // have to sit through animated flips one by one to reach the end ──
        function applyInstantState(targetLeaf) {
            leaves.forEach((leaf, i) => {
                clearTimeout(leaf._flipTimer);
                leaf._flipTimer = null;
                leaf.classList.remove('flipping-forward', 'flipping-backward');
                if (i < targetLeaf) {
                    leaf.classList.add('flipped');
                    leaf.style.zIndex = 100 + i;
                } else {
                    leaf.classList.remove('flipped');
                    leaf.style.zIndex = leaves.length - i;
                }
            });
            document.body.classList.remove('flipping');
            currentLeaf = targetLeaf;
        }

        function firstPage() {
            applyInstantState(0);
        }

        function lastPage() {
            applyInstantState(leaves.length);
        }

        function goToPage(pageNumber) {
            // "page" here maps 1:1 to a leaf/spread, matching how
            // Next/Previous already move through the book.
            if (!leaves.length) return;
            let target = Math.round(pageNumber);
            target = Math.max(1, Math.min(target, leaves.length));
            applyInstantState(target - 1);
        }

        function handlePageJump() {
            const input = document.getElementById('pageJumpInput');
            const val = parseInt(input.value, 10);
            if (!isNaN(val)) {
                goToPage(val);
                input.value = '';
            }
        }

        document.getElementById('pageJumpInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handlePageJump();
        });

        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                const wasAt = currentLeaf;
                paginate();
                applyInstantState(Math.min(wasAt, leaves.length));
            }, 300);
        });

        if (document.fonts) {
            document.fonts.ready.then(() => { paginate(); });
        } else {
            paginate();
        }

        function createStars() {
            const container = document.createElement('div');
            container.className = 'stars-container';
            document.body.appendChild(container);
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 'px';
                star.style.width = size;
                star.style.height = size;
                star.style.top = Math.random() * 100 + '%';
                star.style.left = Math.random() * 100 + '%';
                star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
                container.appendChild(star);
            }
        }

        window.addEventListener('load', createStars);

        function hideGalaxyNotice() {
            document.getElementById("galaxyNoticeOverlay").style.display = "none";
        }

        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                document.getElementById('fs-btn').textContent = '✕';
            } else {
                document.exitFullscreen();
            }
        });

        document.addEventListener('fullscreenchange', () => {
            document.getElementById('fs-btn').textContent = document.fullscreenElement ? '✕' : '⛶';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        let touchStartX = 0;
        document.getElementById('book').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });
        document.getElementById('book').addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].screenX;
            const diff = touchEndX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff < 0) nextPage();
                else prevPage();
            }
        }, { passive: true });

    </script>
</body>

</html>
